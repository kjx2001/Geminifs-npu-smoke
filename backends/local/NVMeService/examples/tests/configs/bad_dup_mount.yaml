# Expected to be rejected: two nvmes share the same mount_path.
grpc:
  endpoint: "127.0.0.1:50051"

gpus:
  - id: 0
    mount_path: "/mnt/gpu0"

nvmes:
  - pci_addr: "0000:50:00.0"
    mount_path: "/mnt/nvme_shared"
    namespace_id: 1
    queue_depth: 1024
    total_queues: 128
    queue_groups:
      - { gpu_id: 0, count: 64 }
  - pci_addr: "0000:51:00.0"
    mount_path: "/mnt/nvme_shared"   # duplicate -- must fail
    namespace_id: 1
    queue_depth: 1024
    total_queues: 128
    queue_groups:
      - { gpu_id: 0, count: 64 }

queue_pool:
  default_per_client: 32
  max_per_client: 128

lease:
  heartbeat_interval_sec: 10
  timeout_sec: 30