# Expected to be rejected: queue_groups references gpu_id=2 not in gpus[].
grpc:
  endpoint: "127.0.0.1:50051"

gpus:
  - id: 0
    mount_path: "/mnt/gpu0"

nvmes:
  - pci_addr: "0000:50:00.0"
    mount_path: "/mnt/nvme0"
    namespace_id: 1
    queue_depth: 1024
    total_queues: 128
    queue_groups:
      - { gpu_id: 2, count: 128 }   # gpu_id 2 not declared above

queue_pool:
  default_per_client: 32
  max_per_client: 128

lease:
  heartbeat_interval_sec: 10
  timeout_sec: 30
