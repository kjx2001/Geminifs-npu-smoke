# Expected to be rejected: sum of queue_groups[].count (200) > total_queues (128).
grpc:
  endpoint: "127.0.0.1:50051"

gpus:
  - id: 0
    mount_path: "/mnt/gpu0"
  - id: 1
    mount_path: "/mnt/gpu1"

nvmes:
  - pci_addr: "0000:50:00.0"
    mount_path: "/mnt/nvme0"
    namespace_id: 1
    queue_depth: 1024
    total_queues: 128
    queue_groups:
      - { gpu_id: 0, count: 100 }
      - { gpu_id: 1, count: 100 }   # 100 + 100 = 200 > 128

queue_pool:
  default_per_client: 32
  max_per_client: 128

lease:
  heartbeat_interval_sec: 10
  timeout_sec: 30
