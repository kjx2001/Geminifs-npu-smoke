# ============================================================================
# sys_config.yaml -- canonical NVMeService daemon config (single source of truth)
#
# This is the ONLY sys_config.yaml that ships with the repo. The build
# system (backends/local/NVMeService/examples/CMakeLists.txt) copies this
# file into build/bin/sys_config.yaml so the example binaries can be run
# directly out of the build tree without any path juggling.
#
# Edit this file to match your host's PCI topology BEFORE running the
# daemon. Run `sudo scripts/pci_topology_check.sh` to discover which
# NVMe BDFs and which CUDA GPU indices share a NUMA node / PCIe switch
# on the current host -- the resulting JSON in /mnt/sys_GPU_NVMe_topology.json
# is the authoritative input for pairing GPU id <-> NVMe pci_addr below.
#
# Current bring-up profile (v0.1):
#   - Single NVMe + single GPU, both on NUMA 0.
#   - Multi-GPU sharing is supported by the schema (queue_groups) but the
#     initial smoke tests stay on the simplest topology to keep failure
#     modes attributable.
# ============================================================================

# ---------------------------------------------------------------------------
# gRPC control-plane endpoint the daemon listens on.
#
# Same-host, trusted-cooperator deployment; loopback is the default.
# Change to "0.0.0.0:<port>" only if you intentionally want to expose the
# daemon to other hosts (CUDA IPC handles still won't work across hosts;
# only the list / allocate / heartbeat RPCs would be reachable).
# ---------------------------------------------------------------------------
grpc:
  endpoint: "127.0.0.1:50051"

# ---------------------------------------------------------------------------
# GPUs known to the daemon.
#
# Each entry declares ONE CUDA device that may consume queues. The `id`
# field is the CUDA device index (matches `cudaSetDevice(id)` and what
# `nvidia-smi -L` prints). The `mount_path` is the per-GPU view directory
# where the daemon installs a symlink to that GPU's per-NVMe subdirectory
# (see nvmes[].queue_groups below). A GPU process attached to this id
# will see "its" NVMe storage at <mount_path>/<basename(snvme_dev_path)>.
#
# It is fine to list GPUs that no current nvme references -- they just
# stay idle until some nvmes[].queue_groups entry points at them.
# ---------------------------------------------------------------------------
gpus:
  - id: 0
    mount_path: "/mnt/gpu0"
  # - id: 1
  #   mount_path: "/mnt/gpu1"
  # - id: 2
  #   mount_path: "/mnt/gpu2"

# ---------------------------------------------------------------------------
# NVMe devices the daemon takes exclusive ownership of.
#
# Per-entry schema:
#
#   pci_addr     PCI BDF in canonical DDDD:BB:DD.F form. Must be the
#                same form `lspci -D` prints. Used by libnvm to find
#                the snvme device node /dev/snvm_<bdf>.
#
#   mount_path   Filesystem mount point for the real NVMe block device
#                (after libnvm has bound it). Each NVMe gets a unique
#                directory. The daemon mkdirs `<mount_path>/GPU<gpu_id>`
#                subdirectories for the GPUs listed in queue_groups,
#                and exposes those as symlinks under each consuming
#                GPU's view dir (gpus[].mount_path).
#
#   namespace_id NVMe namespace (almost always 1 unless the controller
#                exposes multiple namespaces; check `nvme list`).
#
#   queue_depth  Per-IO-queue depth (SQ entries). 1024 is a safe default
#                for modern enterprise SSDs; cap at the controller's MQES
#                if it's smaller.
#
#   total_queues Maximum number of QueuePairs the daemon will claim
#                on this NVMe (user budget; kernel ABI calls this the
#                user-side "ioq_num" but counts SQ+CQ entries, so the
#                snvme NVM_SET_IOQ_NUM submit gets total_queues * 2).
#                Hardware ceiling is checked by the controller at
#                NVM_SET_IOQ_NUM time. Local invariant the daemon
#                enforces (all in QueuePair units):
#                  sum(queue_groups[].count)
#                      + queue_setup.kernel_ioq_cap
#                  <= total_queues
#
# queue_groups (REQUIRED, at least one entry):
#
#   Partitions `total_queues` across the GPUs that will share this NVMe.
#   Each group binds a contiguous QueuePair range to one CUDA device.
#
#     gpu_id    must reference gpus[].id above. The special value -1
#               reserves the range for host-resident queues (CPU_SUBMIT
#               path, future); libnvm currently rejects this at init,
#               so leave the placeholder out until host queues land.
#
#     count     QueuePair count owned by this group (1 pair = 1 SQ + 1 CQ).
#               The daemon translates to the kernel's SQ+CQ-entry unit
#               (count*2) before submitting NVM_SET_IOQ_NUM.
#
#   ORDER MATTERS: the daemon assigns absolute queue ids by walking
#   queue_groups in declaration order. queue_groups[0] gets
#   [0, count_0); queue_groups[1] gets [count_0, count_0+count_1);
#   etc. Sum(count) MUST be <= total_queues. Any leftover queues at
#   the tail stay idle (unallocatable). Reordering this list reshuffles
#   which queue id belongs to which GPU -- treat the order as part of
#   the configuration ABI.
#
# queue_setup (OPTIONAL, snvme queue-budget tuning -- Phase 2):
#
#   Mostly maps 1:1 onto the kernel's `struct nvm_ioctl_setup` payload
#   (see backends/local/nvme/libnvm/include/ioctl.h). The daemon
#   converts this block into a single `NVM_SET_IOQ_NUM` ioctl on the
#   snvme device BEFORE NVM_MAP_*/NVM_SET_SHARE_REG, mirroring the
#   smoke-gpu bring-up sequence at
#   backends/local/kernel_modules/test/snvme_smoke_gpu.cu. libnvm
#   handles the QueuePair -> SQ+CQ-entry unit translation for
#   queue_groups so YAML stays in QueuePair units throughout.
#
#     kernel_ioq_cap  Upper bound on the number of IOQs (QueuePair
#                     units) the kernel-side blk-mq path may claim from
#                     the controller. Default 0 means "use kernel's
#                     num_possible_cpus()".
#                     SET THIS EXPLICITLY when the controller's MSI-X
#                     vector budget is smaller than the host's vCPU
#                     count -- otherwise s_nvme_setup_io_queues falls
#                     back to dma_alloc_coherent and the user share
#                     path silently misses GPU memory. Rule of thumb:
#                     `dmesg | grep "queue squeeze"` after bind -- if
#                     it triggered, lower this value.
#
#     on_host         false (default) => user IOQ ring memory lives in
#                     GPU device memory (NVM_MAP_DEVICE_QUEUE_MEMORY).
#                     true => host RAM (NVM_MAP_HOST_MEMORY); reserved
#                     for the future CPU_SUBMIT path, libnvm currently
#                     refuses it.
#
#     nr_write        Per-BDF override of the snvme module's
#                     write_queues parameter; 0 = leave at module default.
#
#     nr_poll         Same shape, for poll_queues; 0 = module default.
#
#   queue_groups also doubles as the kernel's `groups[]` (owner_id =
#   gpu_id, count = count*2 since the kernel uses SQ+CQ entries).
#   NVM_MAX_QUEUE_GROUPS = 8, so the YAML list must have <= 8 entries.
#
#   Daemon-side validation runs at startup:
#     - sum(queue_groups[].count) + kernel_ioq_cap <= total_queues
#                                                  (all in QueuePair units)
#     - len(queue_groups)                          <= 8
#     - gpu_id (when >= 0)                         present in gpus[]
#     - on_host                                    must be false (today)
#
# Worked example (single NVMe + single GPU on NUMA 0; smoke profile):
#
#   nvmes:
#     - pci_addr: "0000:50:00.0"   # NUMA-0 NVMe per pci_topology_check.sh
#       mount_path: "/mnt/nvme0"
#       namespace_id: 1
#       queue_depth: 1024
#       total_queues: 64           # 32 user + 32 kernel; well under MSI-X
#       queue_groups:
#         - { gpu_id: 0, count: 32 }
#       queue_setup:
#         kernel_ioq_cap: 32       # MSI-X-limited NICs: same caveat as Intel DC SSD
#         on_host: false
#         nr_write: 0
#         nr_poll: 0
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# !!! BRING-UP PROFILE: NUMA 0 single-NVMe + single-GPU smoke !!!
#
# Replace the TODO markers below with values from your host:
#   sudo scripts/pci_topology_check.sh
#   ^ prints a GPU x NVMe distance matrix and writes
#     /mnt/sys_GPU_NVMe_topology.json. Pick a (GPU, NVMe) pair on
#     NUMA 0 with distance 0 (same PCIe switch) or 1 (same NUMA).
#
# Once you have NUMA 0 working, scale up by adding extra queue_groups
# entries for additional GPUs and bumping total_queues. The double-GPU
# config that used to live here is preserved as the second commented
# example below.
# ---------------------------------------------------------------------------
nvmes:
  - pci_addr: "0000:08:00.0"      # TODO: replace with a NUMA-0 NVMe BDF on this host
    mount_path: "/mnt/nvme0"
    namespace_id: 1
    queue_depth: 1024
    total_queues: 128              # 32 user pairs + 32 kernel cap = 64

    queue_groups:
      - { gpu_id: 0, count: 32 }  # TODO: gpu_id must match an entry in `gpus` above
      # - { gpu_id: 1, count: 32 }  # TODO: gpu_id must match an entry in `gpus` above
      # - { gpu_id: 2, count: 32 }  # TODO: gpu_id must match an entry in `gpus` above
    queue_setup:
      kernel_ioq_cap: 32          # MSI-X-limited controllers: this is the
                                  # smoke-gpu reference value. Adjust per
                                  # `dmesg | grep "queue squeeze"`.
      on_host: false
      nr_write: 0
      nr_poll: 0

# ---------------------------------------------------------------------------
# Reference: dual-GPU profile (preserved for when NUMA-0 smoke is green
# and you want to fan out). Comment out the single-GPU block above and
# uncomment this one to use it.
# ---------------------------------------------------------------------------
# nvmes:
#   - pci_addr: "0000:50:00.0"
#     mount_path: "/mnt/nvme0"
#     namespace_id: 1
#     queue_depth: 1024
#     total_queues: 96            # 24 + 24 user pairs + 32 kernel cap = 80 <= 96
#
#     queue_groups:
#       - { gpu_id: 0, count: 24 }
#       - { gpu_id: 1, count: 24 }
#
#     queue_setup:
#       kernel_ioq_cap: 32
#       on_host: false
#       nr_write: 0
#       nr_poll: 0

# ---------------------------------------------------------------------------
# Daemon-side defaults for client allocate() requests.
#
#   default_per_client  num_queues = 0 in AllocateQueues request => use this.
#   max_per_client      Hard cap; requests larger than this are clamped.
# ---------------------------------------------------------------------------
queue_pool:
  default_per_client: 16
  max_per_client: 32

# ---------------------------------------------------------------------------
# Lease lifetime parameters.
#
#   heartbeat_interval_sec  Client bidi-stream heartbeat cadence.
#                           Reaper scans at half this interval.
#   timeout_sec             A silent allocation older than this is a
#                           candidate for reaping (subject to kill(pid,0)
#                           + /proc/<pid>/stat starttime checks; see
#                           nvmeservice_state.cu::is_pid_dead).
#
# Rule of thumb: timeout_sec >= 2 * heartbeat_interval_sec, otherwise
# a single dropped heartbeat reaps a healthy client.
# ---------------------------------------------------------------------------
lease:
  heartbeat_interval_sec: 10
  timeout_sec: 30
